# Default sqlfluff settings for the container (installed as /root/.sqlfluff).
# Lowest priority: a project's own .sqlfluff / pyproject.toml settings win.
# (In pyproject.toml, dialect/templater must be under [tool.sqlfluff.core].)
[sqlfluff]
dialect = postgres
templater = jinja

# Fake values for Airflow's built-in template variables, so templates render.
# Project-specific values (e.g. params) belong in the project's config.
[sqlfluff:templater:jinja:context]
ds = 2024-01-01
ds_nodash = 20240101
ts = 2024-01-01T00:00:00+00:00
ts_nodash = 20240101T000000
logical_date = 2024-01-01T00:00:00+00:00
execution_date = 2024-01-01T00:00:00+00:00
data_interval_start = 2024-01-01T00:00:00+00:00
data_interval_end = 2024-01-02T00:00:00+00:00
run_id = manual__2024-01-01T00:00:00+00:00
