services:
    code-server:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: code-server
        ports:
            - '8081:8081'
        volumes:
            - code-server-config:/root/.config/code-server
            - code-server-extensions:/root/.local/share/code-server/extensions
            - code-server-user:/root/.local/share/code-server
            - code-server-home:/home/coder/workspace_${workspace}
            - ./config/settings.json:/root/.local/share/code-server/User/settings.json
            - ./config/.zshrc:/root/.zshrc
            - ./home_coder/workspace.code-workspace:/home/coder/workspace_${workspace}/workspace_${workspace}.code-workspace
            - ./home_coder/install-extension.sh:/home/coder/workspace_${workspace}/install-extension.sh
            - ./home_coder/README.md:/home/coder/workspace_${workspace}/README.md
            - ~\Downloads\checkdata:/home/coder/workspace_spw/check_Data
            
        environment:
            - 'PASSWORD=${CODE_SERVER_PASSWORD}'
            - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
        user: root
        restart: unless-stopped
        command: 'dumb-init /usr/bin/code-server --bind-addr 0.0.0.0:8081'
        
volumes:
    code-server-config:
    code-server-extensions:
    code-server-user:
    code-server-workspace:
    code-server-home:
