# Normal use: the Neovim config comes from the image (COPY ./src in the Dockerfile).
#   Update config:  docker compose build --builder corp-builder && docker compose up -d
# Development: add docker-compose.dev.yml to bind-mount ./src (no rebuilds):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Don't mount a volume on /root/.config: it would hide the image's config.
services:
  nvim_docker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nvim
    # command: nvim .  # Auto-open Neovim in workdir
    volumes:
      - ~/work:/home/work  # Project code
      - nvim_data:/root/.local/share/nvim
      - claude_config:/root/.claude  # Claude Code login + settings (persists across rebuilds)
    working_dir: /home/work
    environment:
      - PATH=/usr/local/bin:/usr/bin:/bin:$PATH
      - CLAUDE_CONFIG_DIR=/root/.claude  # keep .claude.json inside the volume too
    stdin_open: true
    tty: true

# Named volumes to persist configs
volumes:
  nvim_data:
  claude_config:
