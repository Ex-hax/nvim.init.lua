services:
    nvim_lsp_server:
        build:
            context: .
            dockerfile: Dockerfile.lsp
        container_name: nvim_lsp_server
        ports:
            - '2089:2089' # SQL
            - '3000:3000' # HTML
            - '5005:5005' # PyRight
        restart: unless-stopped
        command: ["tail", "-f", "/dev/null"]
 
